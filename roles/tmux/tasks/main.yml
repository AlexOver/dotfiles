# file: roles/tmux/tasks/main.yml
- name: Install tmux | apt
  become: yes
  become_user: root
  apt:
    name: tmux
    state: present

- name: Link .tmux.conf | file
  file:
    src: '{{ playbook_dir }}/roles/tmux/files/tmux.conf.link'
    dest: '{{ lookup("env", "HOME") }}/.tmux.conf'
    state: link
    force: yes
