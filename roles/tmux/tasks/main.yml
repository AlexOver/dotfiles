# file: roles/tmux/tasks/main.yml
- name: Install tmux | pacman
  become: yes
  ansible.builtin.pacman:
    name: tmux
    state: present

- name: Link .tmux.conf | file
  ansible.builtin.file:
    src: '{{ playbook_dir }}/roles/tmux/files/tmux.conf.link'
    dest: '{{ lookup("env", "HOME") }}/.tmux.conf'
    state: link
    force: yes

- name: Checkout tpm (tmux plugin manager)
  ansible.builtin.git:
    repo: "https://github.com/tmux-plugins/tpm"
    depth: 1
    dest: '{{ lookup("env", "HOME") }}/.tmux/plugins/tpm'
