# file: roles/hyprland/tasks/main.yml

- name: Install Hyprland and Wayland ecosystem packages
  become: true
  ansible.builtin.package:
    name:
      - hyprland
      - hyprlock
      - hyprpaper
      - hypridle
      - hyprlauncher
      - xdg-desktop-portal-hyprland
      - wl-clipboard
      - dunst
      - rofi
      - playerctl
      - brightnessctl
      - network-manager-applet
      - archlinux-xdg-menu
      - gnome-calculator
      - qt6ct
      - cmake
      - ninja
    state: present
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Install Hyprshot
  block:
    - name: Clone/Update Hyprshot
      ansible.builtin.git:
        repo: "https://github.com/Gustash/Hyprshot"
        dest: '{{ lookup("env", "HOME") }}/.hyprland/Hyprshot'
        depth: 1
        version: "main"
        force: true
      register: hyprshot
      changed_when: true

    - name: Link Hyprshot to local bin
      ansible.builtin.file:
        src: '{{ lookup("env", "HOME") }}/.hyprland/Hyprshot/hyprshot'
        dest: '{{ lookup("env", "HOME") }}/.local/bin/hyprshot'
        state: link
        force: true

- name: Ensure backgrounds directory exists
  ansible.builtin.file:
    path: '{{ lookup("env", "HOME") }}/.local/share/backgrounds'
    state: directory
    mode: "0755"

- name: Link multiple config files
  file:
    src: "{{ playbook_dir }}/roles/hyprland/files/{{ item.src }}"
    dest: '{{ lookup("env", "HOME") }}/.local/share/backgrounds/{{ item.dest }}'
    state: link
    force: yes
  loop:
    - { src: "Space_expanded.png", dest: "Space_expanded.png" }
    - { src: "Stellar_expanded.png", dest: "Stellar_expanded.png" }

- name: Create Hyprland config directory
  ansible.builtin.file:
    path: '{{ lookup("env", "HOME") }}/.config/hypr'
    state: directory
    mode: "0755"

- name: Link hyprland.conf
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/hyprland/files/hyprland.conf.link"
    dest: '{{ lookup("env", "HOME") }}/.config/hypr/hyprland.conf'
    state: link
    force: true

- name: Link hyprlock.conf
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/hyprland/files/hyprlock.conf.link"
    dest: '{{ lookup("env", "HOME") }}/.config/hypr/hyprlock.conf'
    state: link
    force: true

- name: Link powermenu.sh
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/hyprland/files/scripts/powermenu.sh.link"
    dest: '{{ lookup("env", "HOME") }}/.config/hypr/scripts/powermenu.sh'
    state: link
    force: true

- name: Copy hyprland custom config (only if not already present)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/hyprland/files/custom.conf"
    dest: '{{ lookup("env", "HOME") }}/.config/hypr/custom.conf'
    mode: "0644"
    force: false

- name: Link hyprpaper.conf
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/hyprland/files/hyprpaper.conf.link"
    dest: '{{ lookup("env", "HOME") }}/.config/hypr/hyprpaper.conf'
    state: link
    force: true
